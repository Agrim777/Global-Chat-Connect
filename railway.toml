[build]
builder = "nixpacks"
buildCommand = "npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server run build"
[deploy]
startCommand = "export NODE_ENV=production && pnpm --filter @workspace/db run push-force && pnpm --filter @workspace/api-server run start"
restartPolicyType = "always"
